function pick(e){

 const hits=ray.intersectObjects(available.map(k=>k.key),true);
 if(!hits.length)return null;
 return available.find(k=>{let o=hits[0].object;while(o){if(o===k.key)return true;o=o.parent;}return false})||null;
}

   const gain=ctx.createGain();gain.gain.value=1.5;
   node.connect(gain);gain.connect(ctx.destination);
   sound.addEventListener('ended',()=>{node.disconnect();gain.disconnect();},{once:true});
  }catch(err){console.warn('Key 3 audio boost unavailable:',err);}
 }
 sound.play().catch(err=>console.warn('Keycap sound unavailable:',err));
}
// Drag across keys to press them one after another while holding left mouse.
function activateKey(k){
 if(held===k)return;
 if(held)held.target=0;
 held=k;
 if(k){k.target=1;playKeyClick();}
}
host.addEventListener('pointerdown',e=>{
 if(e.button!==0||e.shiftKey||orbitDrag)return;
 if(Math.abs(scrollProgress-Math.round(scrollProgress))>.15)return;
 const k=pick(e);
 if(!k)return;
 activePointer=e.pointerId;
 activateKey(k);
 host.setPointerCapture(e.pointerId);
});
host.addEventListener('pointermove',e=>{
 if(activePointer===null||e.pointerId!==activePointer||orbitDrag)return;
 if((e.buttons&1)===0){release(e);return;}
 // Passing through empty space releases the previous key; entering the next
 // key plays its sound once and depresses it.
 activateKey(pick(e));
});
function release(e){
 if(activePointer===null||e.pointerId!==activePointer)return;
 activateKey(null);
 activePointer=null;
}
host.addEventListener('pointerup',release);
host.addEventListener('pointercancel',release);
host.addEventListener('lostpointercapture',release);
window.addEventListener('blur',()=>{
 for(const k of [...keys,...secondKeys,...thirdKeys])k.target=0;
 held=null;activePointer=null;orbitDrag=null;
});

function resize(){
 const w=innerWidth,h=innerHeight;
 camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);fitCameraToKeys();
}
window.addEventListener('resize',resize);resize();
let previous=performance.now();
function frame(t){
 const dt=Math.min((t-previous)/1000,.05);previous=t;
 scrollProgress+=(scrollGoal-scrollProgress)*(1-Math.exp(-dt*5));
 section=THREE.MathUtils.clamp(Math.round(scrollProgress),0,2);
 const t01=THREE.MathUtils.smoothstep(scrollProgress,0,1);
 const t12=THREE.MathUtils.smoothstep(scrollProgress,1,2);
 if(rig.userData.baseY!==undefined)rig.position.y=rig.userData.baseY+2.8*t01;
 if(secondReady)rig2.position.y=rig2.userData.baseY-2.8*(1-t01)+2.8*t12;
 if(thirdReady)rig3.position.y=rig3.userData.baseY-2.8*(1-t12);
 rig.visible=t01<.98;
 rig2.visible=secondReady&&t01>.02&&t12<.98;
 rig3.visible=thirdReady&&t12>.02;
 scrollHint.textContent=section===0?'SCROLL ↓ TO DISCOVER':section===1?'SCROLL ↑ / ↓ TO SWITCH':'SCROLL ↑ TO RETURN';
 document.querySelector('.badge').textContent='4 KEYS READY / 00'+(section+1);
 for(const k of [...keys,...secondKeys,...thirdKeys]){
  k.press+=(k.target-k.press)*(1-Math.exp(-dt*(k.target?22:12)));
  k.key.position.y=k.rest-k.press*.10;
  const v=k.press;
  k.led.visible=v>.015;
  k.led.traverse(o=>{if(o.isMesh)o.visible=v>.015});
  for(const m of k.leds){m.material.emissiveIntensity=m.intensity*v;m.material.opacity=v;}
  for(const m of k.emissive)m.material.emissiveIntensity=m.intensity*v;
  k.lamp.intensity=4*v;
 }
 renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
