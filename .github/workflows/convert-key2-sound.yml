name: Convert key 2 sound
on:
  push:
    paths:
      - 'Key2_Sound.mov'
      - '.github/workflows/convert-key2-sound.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract audio to MP3
        run: ffmpeg -y -i Key2_Sound.mov -vn -codec:a libmp3lame -qscale:a 3 Key2_Sound.mp3
      - name: Commit extracted audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Key2_Sound.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Extract Key2 audio from MOV"
            git push
          fi
